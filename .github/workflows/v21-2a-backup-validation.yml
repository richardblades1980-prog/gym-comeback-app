name: V21.2A backup validation

on:
  push:
    branches:
      - V21.2-development
  pull_request:
    branches:
      - V21.2-development

jobs:
  backup-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install test dependencies
        run: npm install --no-package-lock
      - name: Run backup validation tests
        run: node --test tests/identity-persistence.test.js tests/backup-validation.test.js tests/programme-manager.test.js tests/workload-summary.test.js tests/gym-migration.test.js tests/shared-migration.test.js tests/migration-orchestration.test.js tests/indexeddb-integration.test.js tests/legacy-exercise-name-collisions.test.js tests/exercise-identity-contract.test.js tests/catalogue-delivery-contract.test.js
