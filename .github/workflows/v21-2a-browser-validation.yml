name: V21.2A browser validation

on:
  push:
    branches:
      - V21.2-development
  pull_request:
    branches:
      - V21.2-development

jobs:
  chromium-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Run service-worker cache failure tests
        run: node --test tests/service-worker-cache-failure.test.js
      - name: Run cross-store integrity diagnostics tests
        run: node --test tests/integrity-validation.test.js
      - name: Verify V21.2 browser bundle matches canonical services
        run: node tests/check-v21-2-bundle.js
      - name: Syntax-check V21.2 application JavaScript
        run: node --check v21.2/app.js
      - name: Run canonical exercise identity design contract
        run: node --test tests/exercise-identity-contract.test.js
      - name: Run source-preserved Gym base programme contract
        run: node --test tests/gym-base-programme.test.js
      - name: Run persisted Gym workout engine tests
        run: node --test tests/gym-workout.test.js
      - name: Run Gym progression and history service tests
        run: node --test tests/gym-progression.test.js
      - name: Run catalogue delivery and offline design contract
        run: node --test tests/catalogue-delivery-contract.test.js
      - name: Run exercise guide state tests
        run: node --test tests/exercise-guide.test.js
      - name: Run exercise guide registry validation tests
        run: node --test tests/exercise-guide-registry.test.js
      - name: Run async exercise guide runtime tests
        run: node --test tests/exercise-guide-runtime.test.js
      - name: Run guide artwork manifest integrity contract
        run: node --test tests/guide-assets-contract.test.js
      - name: Run guide artwork service-worker cache contract
        run: node --test tests/guide-assets-cache-contract.test.js
      - name: Run review-only artwork sample contract
        run: node --test tests/artwork-samples-contract.test.js
      - name: Run real IndexedDB identity persistence and backup compatibility tests
        run: node --test tests/identity-persistence.test.js
      - name: Restore Playwright browser binaries
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Chromium
        id: install-chromium
        run: npx playwright install chromium
      - name: Save Playwright browser binaries
        if: steps.install-chromium.outcome == 'success' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package.json') }}
      - name: Run browser migration and offline tests
        run: node tests/browser-validation.js
        timeout-minutes: 10
