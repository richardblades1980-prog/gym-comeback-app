name: V21.2A browser validation

on:
  push:
    branches:
      - V21.2-development
  pull_request:
    branches:
      - V21.2-development

jobs:
  chromium-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser migration and offline tests
        run: node tests/browser-validation.js
